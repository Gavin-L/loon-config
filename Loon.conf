[Proxy Group]
# 第一级：同地区低倍率节点自动测速。
# 第二级：同地区非低倍率或未标倍率节点自动测速。
# 第三级：fallback 先尝试低倍率组；其整体失效才切换到同地区备用组。
# 300 秒检测 / 100 毫秒容差：减少无意义的 IP 跳动，兼顾节点故障恢复。
# 重要：自动测速优选的是延迟，不等于吞吐量/下载速度；无全局跨区测速池。
香港低耗优选 = url-test,香港低倍率,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 100
香港备用优选 = url-test,香港备用,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 100
香港节点 = fallback,香港低耗优选,香港备用优选,url = http://cp.cloudflare.com/generate_204,interval = 300,max-timeout = 3000

台湾低耗优选 = url-test,台湾低倍率,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 100
台湾备用优选 = url-test,台湾备用,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 100
台湾节点 = fallback,台湾低耗优选,台湾备用优选,url = http://cp.cloudflare.com/generate_204,interval = 300,max-timeout = 3000

日本低耗优选 = url-test,日本低倍率,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 100
日本备用优选 = url-test,日本备用,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 100
日本节点 = fallback,日本低耗优选,日本备用优选,url = http://cp.cloudflare.com/generate_204,interval = 300,max-timeout = 3000

美国低耗优选 = url-test,美国低倍率,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 100
美国备用优选 = url-test,美国备用,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 100
美国节点 = fallback,美国低耗优选,美国备用优选,url = http://cp.cloudflare.com/generate_204,interval = 300,max-timeout = 3000

新加坡低耗优选 = url-test,新加坡低倍率,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 100
新加坡备用优选 = url-test,新加坡备用,url = http://cp.cloudflare.com/generate_204,interval = 300,tolerance = 100
